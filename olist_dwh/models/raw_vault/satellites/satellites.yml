version: 2

models:
  - name: sat_customer_details
    description: Customer attributes satellite
    columns:
      - name: hub_customer_hash
        description: Foreign key to hub_customer
        tests:
          - not_null
      - name: customer_id
      - name: customer_zip_code_prefix
      - name: customer_city
      - name: customer_state
      - name: hash_diff
        description: Hash of attributes for change detection
      - name: load_date
        description: When record was loaded
        tests:
          - not_null
      - name: record_source
      - name: batch_id

  - name: sat_order_status
    description: Order status and timeline satellite
    columns:
      - name: hub_order_hash
        tests:
          - not_null
      - name: order_status
      - name: order_purchase_timestamp
      - name: order_approved_at
      - name: order_delivered_carrier_date
      - name: order_delivered_customer_date
      - name: order_estimated_delivery_date
      - name: hash_diff
      - name: load_date
        tests:
          - not_null

  - name: sat_order_payments
    description: Order payments satellite (multi-active)
    columns:
      - name: hub_order_hash
        tests:
          - not_null
      - name: payment_sequential
        description: Payment sequence identifier
      - name: payment_type
      - name: payment_installments
      - name: payment_value
      - name: hash_diff
      - name: load_date
        tests:
          - not_null

  - name: sat_order_item_finance
    description: Order item financial details
    columns:
      - name: hub_order_item_hash
        tests:
          - not_null
      - name: price
      - name: freight_value
      - name: hash_diff
      - name: load_date
        tests:
          - not_null

  - name: sat_product_details
    description: Product attributes satellite
    columns:
      - name: hub_product_hash
        tests:
          - not_null
      - name: product_category_name
      - name: product_name_lenght
      - name: product_description_lenght
      - name: product_photos_qty
      - name: product_weight_g
      - name: product_length_cm
      - name: product_height_cm
      - name: product_width_cm
      - name: hash_diff
      - name: load_date
        tests:
          - not_null